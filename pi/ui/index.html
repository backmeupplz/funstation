<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>funstation</title>
<style>
  :root { --bg: #0d0f1a; --card: #1a1e33; --fg: #eef0ff; --dim: #8a90b8; --hot: #ffcc33; }
  * { box-sizing: border-box; margin: 0; }
  body { background: radial-gradient(ellipse at top, #1f2547, var(--bg) 70%); color: var(--fg);
         font-family: system-ui, sans-serif; height: 100vh; overflow: hidden; cursor: default; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 4vh 5vw 0; }
  h1 { font-size: 5vh; font-weight: 800; letter-spacing: -.03em; }
  h1 span { color: var(--hot); }
  #clock { font-size: 4vh; color: var(--dim); font-variant-numeric: tabular-nums; }
  #row { display: flex; gap: 3vw; padding: 8vh 5vw; overflow-x: auto; scroll-behavior: smooth; scrollbar-width: none; }
  .card { flex: 0 0 auto; width: 24vh; outline: none; transition: transform .15s; }
  .art { height: 34vh; border-radius: 2vh; background: var(--card) center/cover no-repeat; display: grid;
         place-items: center; font-size: 12vh; box-shadow: 0 2vh 4vh #0008; border: .5vh solid transparent; }
  .card:focus { transform: scale(1.08); }
  .card:focus .art { border-color: var(--hot); box-shadow: 0 0 6vh #ffcc3355; }
  .name { margin-top: 2vh; font-size: 2.6vh; text-align: center; color: var(--dim); }
  .card:focus .name { color: var(--fg); }
  .art { position: relative; }
  .badge { position: absolute; bottom: 1.5vh; left: 50%; transform: translateX(-50%); background: var(--hot); color: var(--bg);
           font-size: 2vh; font-weight: 700; padding: .4vh 1.2vh; border-radius: 1vh; white-space: nowrap; }
  .navidrome .art { background: url(navidrome.png) center/70% no-repeat, linear-gradient(160deg, #1d3557, #0b1220); }
  .jellyfin .art { background: url(jellyfin.svg) center/80% no-repeat, linear-gradient(160deg, #2b1d3f, #0b1424); }
  .settings .art { background: url(settings.svg) center/60% no-repeat, linear-gradient(160deg, #2a2f4f, #10131f); }
  .gemflix .art { background: url(gemflix.svg) center/90% no-repeat, linear-gradient(160deg, #3a1219, #0c0809); }
  dialog { margin: auto; padding: 4vh; max-width: 70vw; border: 0; border-radius: 2vh; background: var(--card); color: var(--fg); font-size: 2.6vh; }
  dialog::backdrop { background: #000b; }
  dialog p { margin: 2vh 0; }
  dialog button { font: inherit; padding: 1vh 2vw; margin: 1vh; border: .4vh solid transparent; border-radius: 1vh; cursor: pointer; }
  dialog button:focus { outline: none; border-color: var(--hot); background: var(--bg); color: var(--fg); }
  #settings-error { color: #ffb4b4; }
  footer { position: fixed; bottom: 4vh; left: 5vw; right: 5vw; color: var(--dim); font-size: 2.2vh; display: flex; gap: 3vw; }
  b { color: var(--fg); }
  #busy { position: fixed; inset: 0; background: var(--bg); display: none; place-items: center; font-size: 4vh; }
</style>
</head>
<body>
<header><h1>fun<span>station</span></h1><div id="clock"></div></header>
<div id="row"></div>
<footer><span><b>A</b> open</span><span><b>B</b> back</span><span><b>Y</b> close app</span><span><b>stick</b> mouse</span><span><b>stick press</b> keyboard</span><span><b>Xbox</b> home</span></footer>
<div id="busy">Loading…</div>
<dialog id="settings" aria-labelledby="settings-title">
  <h2 id="settings-title">Settings</h2>
  <p>Reboot Funstation? Running apps will close and the Pi will restart.</p>
  <p id="settings-error" role="alert"></p>
  <button id="cancel-reboot" autofocus>Cancel</button><button id="reboot">Reboot</button>
</dialog>
<script>
const row = document.getElementById('row'), busy = document.getElementById('busy');
const settings = document.getElementById('settings'), rebootButton = document.getElementById('reboot');
document.getElementById('cancel-reboot').onclick = () => settings.close();
rebootButton.onclick = async () => {
  rebootButton.disabled = true;
  document.getElementById('settings-error').textContent = '';
  try {
    const response = await fetch('/api/reboot', { method: 'POST' });
    if (!response.ok) throw new Error('Reboot failed. Please try again.');
    busy.textContent = 'Rebooting…'; busy.style.display = 'grid';
    settings.close();
  } catch (error) {
    document.getElementById('settings-error').textContent = error.message;
  } finally {
    rebootButton.disabled = false;
  }
};
const card = (cls, name, art, app) => {
  const c = document.createElement('div');
  c.className = 'card ' + cls; c.tabIndex = 0; c.setAttribute('role', 'button'); c.app = app; c.go = () => launch({ app });
  c.innerHTML = `<div class="art"><span class="ph">${art}</span></div><div class="name"></div>`;
  c.querySelector('.name').textContent = name;
  c.onmouseenter = () => c.focus();
  row.append(c); return c;
};
const WEBAPPS = { jellyfin: ['Jellyfin', ''], navidrome: ['Music', ''], gemflix: ['Gemflix', ''] };
const cards = () => [...row.querySelectorAll('.card')];
const show = () => { busy.style.display = 'grid'; setTimeout(() => busy.style.display = 'none', 15000); };

const launch = body => { show(); fetch('/api/launch', { method: 'POST', body: JSON.stringify(body) }); };
function render(s) {
  const i = Math.max(cards().indexOf(document.activeElement), 0);
  row.replaceChildren();
  for (const a of s.apps) card(a, ...WEBAPPS[a], a);
  card('settings', 'Settings', '').go = () => {
    document.getElementById('settings-error').textContent = '';
    settings.showModal();
    document.getElementById('cancel-reboot').focus();
  };
  for (const g of s.games) {
    const c = card('game', g.name, '🎮', g.file);
    const img = new Image(), url = '/cover/' + encodeURIComponent(g.file);
    img.onload = () => { const a = c.querySelector('.art'); a.style.backgroundImage = `url("${url}")`; a.querySelector('.ph')?.remove(); };
    img.src = url;
  }
  for (const c of cards()) if ((c.running = s.running.includes(c.app))) c.querySelector('.art').insertAdjacentHTML('beforeend', '<span class="badge">▶ running</span>');
  if (!settings.open) (cards()[Math.min(i, cards().length - 1)] || document.body).focus();
}
const refresh = () => fetch('/api/state').then(r => r.json()).then(render);
refresh();
// Coming back from an app (Xbox button): drop the loading screen, update "running" badges.
// Jellyfin is another tab (visibilitychange); a game is another window covering this one (focus).
const back = () => { busy.style.display = 'none'; refresh(); };
document.addEventListener('visibilitychange', () => document.hidden || back());
addEventListener('focus', back);

addEventListener('keydown', ev => {
  if (settings.open) {
    if (ev.altKey && ev.key === 'ArrowLeft') settings.close(); // B on the controller
    else if (ev.key.startsWith('Arrow')) {
      const buttons = [...settings.querySelectorAll('button:not(:disabled)')];
      buttons[(buttons.indexOf(document.activeElement) + 1) % buttons.length]?.focus();
    } else return; // native Enter/Space activation and Escape dismissal
    ev.preventDefault();
    return;
  }
  const all = cards(), i = all.indexOf(document.activeElement);
  if (ev.key === 'ArrowRight' || ev.key === 'ArrowDown') all[Math.min(i + 1, all.length - 1)]?.focus();
  else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowUp') all[Math.max(i - 1, 0)]?.focus();
  else if (ev.key === 'Enter' || ev.key === ' ') document.activeElement.go?.();
  else if (ev.key === 'Delete' && document.activeElement.running)  // Y on the controller
    fetch('/api/close', { method: 'POST', body: JSON.stringify({ app: document.activeElement.app }) }).then(refresh);
  else return;
  ev.preventDefault();
});
// A (left click) anywhere opens the focused card, so D-pad + A works without aiming the mouse.
addEventListener('click', ev => {
  if (ev.target.closest('dialog')) return;
  if (settings.open) { document.activeElement.click(); return; }
  (ev.target.closest('.card') || document.activeElement).go?.();
});
setInterval(() => document.getElementById('clock').textContent =
  new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), 1000);
</script>
</body>
</html>
