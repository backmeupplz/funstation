<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Gemflix logo">
  <title>Gemflix logo</title>
  <!--
    GEM — the Gemflix mark.

    A cut stone in profile, on the dark tile.

    The stone is two paths — the crown (table to girdle) a step lighter than
    the pavilion below it, which is all the faceting a mark needs to read as
    cut rather than as a shield.

    Every shape is stroked in its own fill with a round linejoin. That is how
    the corners get rounded: the culet and the girdle corners are sharp
    enough to turn to mush when antialiased small.
  -->
  <defs>
    <!-- Light falls from the upper left, as on the rest of the site. -->
    <linearGradient id="gf-crown" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FF8A8F"/>
      <stop offset="1" stop-color="#FF4A60"/>
    </linearGradient>
    <linearGradient id="gf-pavilion" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F0304B"/>
      <stop offset="0.55" stop-color="#DC1F3C"/>
      <stop offset="1" stop-color="#9A1229"/>
    </linearGradient>
  </defs>


  <g stroke-linejoin="round">
    <path d="M182 136 H330 L410 210 H102 Z" fill="url(#gf-crown)" stroke="url(#gf-crown)" stroke-width="16"/>
    <path d="M102 222 H410 L256 398 Z" fill="url(#gf-pavilion)" stroke="url(#gf-pavilion)" stroke-width="16"/>
  </g>
</svg>
