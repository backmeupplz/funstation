name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Our own PRs and pushes run on the Mac runners; outsiders' PRs (AGit via the github bot) on Linux
    runs-on: ${{ (github.event_name != 'pull_request' || contains(fromJSON('["backmeupplz","renovate","claude"]'), github.event.pull_request.user.login)) && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Syntax only: the imports (evdev, websocket, tkinter) exist on the Pi, not here
      - run: python3 -m py_compile pi/funstation.py
      - run: |
          for f in install.sh pi/setup.sh; do bash -n "$f" || exit 1; done
          for f in pi/bt-autoconnect.sh pi/xinitrc; do sh -n "$f" || exit 1; done
